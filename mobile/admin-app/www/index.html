<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BREM 관리자앱</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #0a0a0a;
      color: #e8c547;
      font-family: "Noto Sans KR", system-ui, sans-serif;
    }
    body {
      display: grid;
      place-items: center;
      padding: 32px 20px;
      box-sizing: border-box;
    }
    .box {
      width: min(100%, 360px);
      text-align: center;
    }
    h1 { margin: 0 0 10px; font-size: 1.15rem; }
    p { margin: 0 0 18px; color: rgba(232, 197, 71, 0.78); font-size: 0.9rem; line-height: 1.5; }
    button {
      min-height: 46px;
      padding: 0 22px;
      border: 0;
      border-radius: 999px;
      background: #e8c547;
      color: #0a0a0a;
      font-weight: 800;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>연결을 확인해주세요</h1>
    <p>인터넷이 없거나 서버에 잠시 연결되지 않았습니다. 연결 후 다시 시도해주세요.</p>
    <button type="button" id="retryBtn">다시 시도</button>
  </div>
  <script>
    var APP_URL = 'https://brem.kr/admin-app.html';
    function go() { window.location.replace(APP_URL); }
    document.getElementById('retryBtn').addEventListener('click', go);
    if (navigator.onLine !== false) setTimeout(go, 400);
  </script>
</body>
</html>
